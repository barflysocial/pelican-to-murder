<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Barfly Social Mystery</title>
  <meta name="description" content="A Live Detective Mystery Experience by Barfly Social. RSVP, check in, and choose your case." />
  <meta property="og:title" content="Barfly Social Mystery" />
  <meta property="og:description" content="A Live Detective Mystery Experience by Barfly Social. RSVP, check in, and choose your case." />
  <meta property="og:image" content="__SITE_URL__/assets/brand/barfly-social-mystery-share-card-1200x630.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="__SITE_URL__/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Barfly Social Mystery" />
  <meta name="twitter:description" content="A Live Detective Mystery Experience by Barfly Social." />
  <meta name="twitter:image" content="__SITE_URL__/assets/brand/barfly-social-mystery-share-card-1200x630.png" />
  <style>
:root{--orange:#ff7a34;--pink:#ec3897;--gold:#ffe27a;--bg:#08060d;--muted:#e8dff2;--line:rgba(255,255,255,.16);--panel:rgba(8,10,18,.82);--radius:28px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#09050c;color:#fff}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 0,#82314e 0,#2a1028 42%,#07040a 100%);z-index:-2}.view{display:none}.view.active{display:block}.app-shell{width:min(1120px,100%);margin:0 auto;padding:clamp(12px,2vw,24px) clamp(12px,3vw,28px) 60px}.splash{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:radial-gradient(circle at center,#31122a,#08050a 72%);transition:opacity .6s ease,visibility .6s ease}.splash.hide{opacity:0;visibility:hidden}.splash-logo{text-align:center;animation:splashIn .7s ease both}.splash-mark{width:92px;height:92px;border-radius:30px;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--orange),var(--pink));box-shadow:0 0 55px rgba(236,56,151,.45);font-size:44px}.splash-title{font-size:clamp(32px,8vw,68px);font-weight:1000;letter-spacing:.02em;line-height:.95}.splash-title span{display:block;font-family:cursive;font-weight:800;color:#ff65c1;text-shadow:0 0 20px rgba(236,56,151,.75)}.splash-sub{margin-top:12px;color:var(--gold);text-transform:uppercase;letter-spacing:.18em;font-size:12px;font-weight:900}@keyframes splashIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}button{font:inherit;font-weight:950;border:0;cursor:pointer}.primary,.secondary,.ghost,.chip{min-height:52px;border-radius:999px;padding:0 22px}.primary{color:#fff;background:linear-gradient(90deg,var(--orange),var(--pink));box-shadow:0 14px 34px rgba(236,56,151,.34)}.secondary{color:#fff;background:rgba(13,14,22,.58);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px)}.ghost{color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18)}.hero-stage{position:relative;max-width:min(520px,100%);margin:0 auto;border:1px solid var(--line);border-radius:34px;overflow:hidden;box-shadow:0 34px 100px rgba(0,0,0,.55);background:#050408}.hero-bg{display:block;width:100%;height:auto}.hero-overlay{position:absolute;left:0;right:0;bottom:2.6%;padding:14px 18px max(20px,env(safe-area-inset-bottom));display:grid;gap:10px}.hero-actions{display:grid;gap:10px}.hero-actions button{width:100%;max-width:360px;margin:0 auto}.section-head,.narrow,.game-card,.detail-card,.share-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 24px 70px rgba(0,0,0,.42);backdrop-filter:blur(14px)}.section-head,.narrow{padding:24px}.eyebrow{margin:0 0 8px;color:var(--gold);font-weight:950;text-transform:uppercase;letter-spacing:.13em;font-size:12px}h1,h2,h3{margin:0 0 10px;line-height:1.03}h2{font-size:clamp(30px,5vw,54px)}h3{font-size:clamp(22px,3.5vw,36px)}p{color:var(--muted);line-height:1.55}.filters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}.chip{min-height:42px;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}.chip.active{background:rgba(255,226,122,.18);border-color:rgba(255,226,122,.45)}.game-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:18px}.game-card{overflow:hidden}.game-card figure{margin:0;aspect-ratio:9/14;overflow:hidden;background:#111}.game-card img{display:block;width:100%;height:100%;object-fit:cover}.game-body{padding:18px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{font-size:12px;font-weight:900;color:#fff;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 10px}.detail-card{overflow:hidden;margin-top:14px}.detail-layout{display:grid;grid-template-columns:minmax(240px,380px) 1fr}.detail-layout>img{width:100%;height:100%;object-fit:cover}.detail-copy{padding:24px}.rsvp-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.rsvp-form label,.narrow label{display:grid;gap:6px;color:#fff;font-weight:850;text-align:left}.rsvp-form label.full{grid-column:1/-1}input,select,textarea{width:100%;min-height:48px;border-radius:16px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;padding:0 14px;font:inherit}.rsvp-form button{grid-column:1/-1}.notice{margin-top:14px;padding:14px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;min-height:48px}.narrow{max-width:560px;margin:30px auto}.confirmation{background:rgba(23,156,102,.17);border-color:rgba(23,156,102,.44)}.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:18px;background:rgba(0,0,0,.72);backdrop-filter:blur(8px)}.modal.active{display:grid}.share-card{width:min(560px,100%);padding:22px}.share-card img.qr{width:220px;height:220px;background:#fff;padding:10px;border-radius:18px;margin:10px auto;display:block}.share-link,.share-text{font-size:14px;line-height:1.45;word-break:break-word;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:12px}.share-actions{display:grid;gap:10px;margin-top:14px}.close-x{float:right;min-height:38px;padding:0 14px}@media(max-width:760px){.app-shell{padding-top:10px}.hero-stage{border-radius:26px}.section-head,.detail-copy,.narrow,.share-card{padding:18px}.game-list{grid-template-columns:1fr}.detail-layout{grid-template-columns:1fr}.rsvp-form{grid-template-columns:1fr}.share-card img.qr{width:200px;height:200px}}@media(min-width:900px){#homeView{padding-top:8px}.hero-stage{max-width:500px}}.error-note{white-space:pre-wrap;background:#3a0712;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:12px;margin-top:14px;font-size:13px}
</style>
</head>
<body>
  <div id="splash" class="splash" aria-label="Barfly Social splash screen">
    <div class="splash-logo">
      <div class="splash-mark">🕵️</div>
      <div class="splash-title">BARFLY <span>Social</span></div>
      <div class="splash-sub">Live Mystery Hub</div>
    </div>
  </div>

  <div class="app-shell">
    <main>
      <section id="homeView" class="view active">
        <div class="hero-stage">
          <img class="hero-bg" src="assets/brand/barfly-social-mystery-hero-9x16.png" alt="Barfly Social Mystery title graphic" />
          <div class="hero-overlay">
            <div class="hero-actions">
              <button id="openRsvp" class="primary">RSVP</button>
              <button id="openMyRsvp" class="secondary">My RSVP</button>
              <button id="shareBtn" class="secondary">Share</button>
            </div>
          </div>
        </div>
      </section>

      <section id="rsvpView" class="view">
        <div class="section-head">
          <p class="eyebrow">RSVP</p>
          <h2>Pick your mystery</h2>
          <p>Each RSVP card uses its own game title graphic.</p>
        </div>
        <div class="filters"><button class="chip active">All</button><button class="chip">Easy</button><button class="chip">Medium</button><button class="chip">Hard</button></div>
        <div id="gameList" class="game-list"></div>
      </section>

      <section id="detailView" class="view">
        <button id="backToRsvp" class="ghost">← Back to RSVP</button>
        <div id="detailMount"></div>
      </section>

      <section id="myRsvpView" class="view narrow">
        <p class="eyebrow">My RSVP</p><h2>Find your reservation</h2>
        <label>First name <input id="lookupName" placeholder="First name" /></label>
        <label>Phone number <input id="lookupPhone" placeholder="10-digit phone" inputmode="numeric" /></label>
        <button id="lookupBtn" class="primary">Find RSVP</button>
        <div id="lookupResult" class="notice"></div>
      </section>
    </main>
  </div>

  <div id="shareModal" class="modal" role="dialog" aria-modal="true" aria-label="Share Barfly Social Mystery">
    <div class="share-card">
      <button id="closeShare" class="ghost close-x">×</button>
      <p class="eyebrow">Share</p>
      <h2>Invite players</h2>
      <p>This link is set up with a rich preview image for social/text sharing.</p>
      <img id="qrImg" class="qr" alt="QR code for Barfly Social Mystery" />
      <div id="shareText" class="share-text"></div>
      <div id="shareLink" class="share-link"></div>
      <div class="share-actions">
        <button id="copyInvite" class="primary">Copy Rich Invite Text</button>
        <button id="copyLink" class="secondary">Copy Link</button>
        <button id="nativeShare" class="secondary">Open Phone Share</button>
      </div>
    </div>
  </div>

  <script>
const EMBEDDED_MANIFEST = {"brand": {"title": "Barfly Social Mystery", "hero": "assets/brand/barfly-social-mystery-hero-9x16.png"}, "games": [{"id": "el-paso-denham-001", "file": "games/el-paso-denham-001-the-missing-till.json", "title": "Margaritas and Murder at El Paso: The Missing Till", "shortTitle": "The Missing Till", "difficulty": "Easy", "runtime": 30, "briefing": 5, "venue": "El Paso Mexican Restaurant — Denham Springs", "series": "Margaritas and Murder at El Paso", "graphic": "assets/games/el-paso-denham-001-the-missing-till-title-9x16.jpg", "dateLabel": "Next available session", "timeLabel": "Host scheduled time", "priceLabel": "Set by host"}, {"id": "el-paso-denham-002", "file": "games/el-paso-denham-002-the-patio-witness.json", "title": "Margaritas and Murder at El Paso: The Patio Witness", "shortTitle": "The Patio Witness", "difficulty": "Medium", "runtime": 30, "briefing": 5, "venue": "El Paso Mexican Restaurant — Denham Springs", "series": "Margaritas and Murder at El Paso", "graphic": "assets/games/el-paso-denham-002-the-patio-witness-title-9x16.jpg", "dateLabel": "Next available session", "timeLabel": "Host scheduled time", "priceLabel": "Set by host"}, {"id": "el-paso-denham-003", "file": "games/el-paso-denham-003-the-last-toast.json", "title": "Margaritas and Murder at El Paso: The Last Toast", "shortTitle": "The Last Toast", "difficulty": "Hard", "runtime": 30, "briefing": 5, "venue": "El Paso Mexican Restaurant — Denham Springs", "series": "Margaritas and Murder at El Paso", "graphic": "assets/games/el-paso-denham-003-the-last-toast-title-9x16.jpg", "dateLabel": "Next available session", "timeLabel": "Host scheduled time", "priceLabel": "Set by host"}]};
const views=[...document.querySelectorAll('.view')];
let manifest=EMBEDDED_MANIFEST;
let selectedGame=null;
function show(id){views.forEach(v=>v.classList.toggle('active',v.id===id));scrollTo({top:0,behavior:'smooth'});}
function moneySafe(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
async function safeJsonFetch(url){
  try{
    const res=await fetch(url,{cache:'no-store'});
    const ct=(res.headers.get('content-type')||'').toLowerCase();
    if(!res.ok) throw new Error(url+' returned '+res.status);
    if(!ct.includes('json')) throw new Error(url+' returned '+ct+' instead of JSON');
    return await res.json();
  }catch(err){ console.warn('JSON fetch skipped:',err.message); return null; }
}
async function boot(){
  const remote=await safeJsonFetch('/games-manifest.json');
  if(remote&&Array.isArray(remote.games)) manifest=remote;
  renderGames();
  setTimeout(()=>document.getElementById('splash').classList.add('hide'),1350);
}
function renderGames(filter='All'){
  const list=document.getElementById('gameList');
  const games=manifest.games.filter(g=>filter==='All'||g.difficulty===filter);
  list.innerHTML=games.map(g=>`<article class="game-card"><figure><img src="${moneySafe(g.graphic)}" alt="${moneySafe(g.title)}"></figure><div class="game-body"><p class="eyebrow">${moneySafe(g.difficulty)} Mystery</p><h3>${moneySafe(g.shortTitle)}</h3><p>${moneySafe(g.venue)}</p><div class="meta"><span class="pill">${g.runtime} min</span><span class="pill">${moneySafe(g.dateLabel)}</span><span class="pill">${moneySafe(g.timeLabel)}</span></div><button class="primary" data-game="${moneySafe(g.id)}">Reserve this mystery</button></div></article>`).join('');
  list.querySelectorAll('[data-game]').forEach(btn=>btn.onclick=()=>openDetail(btn.dataset.game));
}
async function openDetail(id){
  selectedGame=manifest.games.find(g=>g.id===id);
  const data=await safeJsonFetch('/'+selectedGame.file);
  const intro=data?.briefing?.host_read || data?.briefing?.intro || 'A live detective mystery experience at El Paso Mexican Restaurant in Denham Springs.';
  const mount=document.getElementById('detailMount');
  mount.innerHTML=`<article class="detail-card"><div class="detail-layout"><img src="${moneySafe(selectedGame.graphic)}" alt="${moneySafe(selectedGame.title)}"><div class="detail-copy"><p class="eyebrow">${moneySafe(selectedGame.series)}</p><h2>${moneySafe(selectedGame.title)}</h2><p>${moneySafe(intro)}</p><div class="meta"><span class="pill">Difficulty: ${moneySafe(selectedGame.difficulty)}</span><span class="pill">Investigation: ${selectedGame.runtime} min</span><span class="pill">Briefing: ${selectedGame.briefing} min</span></div><form id="reserveForm" class="rsvp-form"><label>First name<input name="first" required placeholder="First name"></label><label>Phone<input name="phone" required inputmode="numeric" placeholder="10-digit phone"></label><label class="full">Session<select name="session"><option>Next available host session</option><option>Tonight — Host scheduled</option><option>Private event / manual code</option></select></label><button class="primary">Confirm RSVP</button></form><div id="reserveResult" class="notice"></div></div></div></article>`;
  document.getElementById('reserveForm').onsubmit=(e)=>{e.preventDefault(); const fd=new FormData(e.target); const code=Math.floor(10000+Math.random()*89999); localStorage.setItem('barfly-rsvp',JSON.stringify({game:selectedGame.title,first:fd.get('first'),phone:fd.get('phone'),code})); document.getElementById('reserveResult').classList.add('confirmation'); document.getElementById('reserveResult').innerHTML=`RSVP saved for <strong>${moneySafe(selectedGame.shortTitle)}</strong>. Demo access code: <strong>${code}</strong>. In paid mode, the host can withhold this code and give it manually.`;};
  show('detailView');
}
function shareUrl(){return location.origin + location.pathname;}
function inviteText(){return `Barfly Social Mystery
A Live Detective Mystery Experience
RSVP and choose your case: ${shareUrl()}`;}
function openShare(){
  const url=shareUrl();
  document.getElementById('shareLink').textContent=url;
  document.getElementById('shareText').textContent=inviteText();
  document.getElementById('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=260x260&data='+encodeURIComponent(url);
  document.getElementById('shareModal').classList.add('active');
}
async function copyText(txt,label){
  try{await navigator.clipboard.writeText(txt); alert(label+' copied.');}
  catch(e){prompt('Copy this:',txt);}
}
document.getElementById('openRsvp').onclick=()=>show('rsvpView');
document.getElementById('openMyRsvp').onclick=()=>show('myRsvpView');
document.getElementById('shareBtn').onclick=openShare;
document.getElementById('closeShare').onclick=()=>document.getElementById('shareModal').classList.remove('active');
document.getElementById('copyLink').onclick=()=>copyText(shareUrl(),'Link');
document.getElementById('copyInvite').onclick=()=>copyText(inviteText(),'Invite text');
document.getElementById('nativeShare').onclick=async()=>{const data={title:'Barfly Social Mystery',text:'A Live Detective Mystery Experience by Barfly Social.',url:shareUrl()}; if(navigator.share) await navigator.share(data); else copyText(inviteText(),'Invite text');};
document.getElementById('backToRsvp').onclick=()=>show('rsvpView');
document.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));ch.classList.add('active');renderGames(ch.textContent.trim());});
document.getElementById('lookupBtn').onclick=()=>{const saved=JSON.parse(localStorage.getItem('barfly-rsvp')||'null');document.getElementById('lookupResult').innerHTML=saved?`Found RSVP for <strong>${moneySafe(saved.first)}</strong>: ${moneySafe(saved.game)}. Code: <strong>${saved.code}</strong>.`:'No local demo RSVP found on this device.'};
boot().catch(err=>{document.body.insertAdjacentHTML('beforeend',`<div class="error-note">${moneySafe(err.message)}</div>`);});
</script>
</body>
</html>
